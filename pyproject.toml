[project]
name = "inzaghi"
version = "0.1.0"
description = "A terminal interface to folder-based channels with unattended agent sessions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
]

[project.scripts]
inzaghi = "inzaghi.cli:main"
inz = "inzaghi.cli:main"  # short alias; same entry point

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inzaghi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
